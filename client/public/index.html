<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>50 فاكهة - العميل</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FFF7EC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="50 فاكهة" />
  <link rel="apple-touch-icon" href="/logo.png" />
  
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            },
            accent: {
              50: '#fff1f2',
              100: '#ffe4e6',
              200: '#fecdd3',
              300: '#fda4af',
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>
<body class="h-full">
  <div id="root" class="min-h-full flex flex-col"></div>
  
  <!-- Register/Unregister PWA Service Worker depending on environment -->
  <script>
    const isCapacitor = window.hasOwnProperty('Capacitor') || 
                        window.Capacitor || 
                        navigator.userAgent.includes('Capacitor') || 
                        window.location.href.startsWith('capacitor:') || 
                        (window.location.hostname === 'localhost' && window.location.port === ''); // local Android WebView fallback

    if (isCapacitor) {
      console.log('Running inside Native App (Capacitor) — Disabling Service Worker.');
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          let found = false;
          for (let reg of registrations) {
            reg.unregister().then(success => {
              if (success) {
                console.log('Unregistered active service worker in native app context.');
                found = true;
              }
            });
          }
          if (found) {
            // Reload page to fetch clean assets directly from the Capacitor APK bundle
            setTimeout(() => { window.location.reload(); }, 150);
          }
        });
      }
    } else {
      // Standard PWA registration for web browsers
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Service worker registered successfully!', reg))
            .catch(err => console.error('PWA Service worker registration failed:', err));
        });
      }
    }
  </script>
</body>
</html>
